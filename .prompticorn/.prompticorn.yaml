version: '1.0'
repository:
  type: multi-language-monorepo
  mappings: {}
spec:
  - folder: backend/api
    type: backend
    subtype: api
    language: python
    runtime: '3.14'
    package_manager: uv
    test_framework: pytest
    linter: ruff
    linters:
      - ruff
    formatter: ruff
    coverage:
      line: 80
      branch: 70
      function: 90
      statement: 85
      mutation: 80
      path: 60
    python_runtime: '3.14'
    python_package_manager: uv
    python_test_framework: hybrid
    python_test_runner: pytest
    python_linter:
      - ruff
    python_formatter:
      - ruff
    python_abstract_class_style: interface
    mocking_library:
      - unittest.mock
    coverage_tool: pytest-cov
    mutation_tool: mutmut
  - folder: frontend/ui
    type: frontend
    subtype: ui
    language: typescript
    runtime: v6.0
    package_manager: pnpm
    test_framework: vitest
    linter: eslint
    linters:
      - eslint
    formatter: prettier
    coverage:
      line: 80
      branch: 70
      function: 90
      statement: 85
      mutation: 80
      path: 60
    typescript_version: v6.0
    typescript_package_manager: pnpm
    typescript_test_framework: vitest
project:
  layout_style: flat
  database: DuckDB
  orm: none (raw SQL)
  error_handling: Exceptions
  commit_style: Conventional Commits
  pr_size: ''
  deploy_target: Kubernetes (Helm)
variant: verbose
active_personas:
  - backend_software_engineer
  - frontend_software_engineer
  - fullstack_software_engineer
  - software_engineer
  - architect
  - qa_tester
  - devops_engineer
  - security_engineer
  - product_manager
  - technical_writer
