[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lavs"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "duckdb>=1.5.0",
    "fastapi>=0.135.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.12.5",
    "python-ulid>=3.1.0",
    "pyyaml>=6.0.0",
    "stytch>=15.3.0",
    "uvicorn>=0.40.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.389",
    "build>=1.0.0",
    "httpx>=0.28.1",
    "testcontainers[postgres]>=4.14.2",
]

[tool.uv]
# Security floors for transitive dependencies (Dependabot advisories).
# These keep vulnerable versions out of the lockfile on future re-resolution.
constraint-dependencies = [
    "starlette>=1.3.1",  # DoS via form limits, SSRF/UNC, host-header poisoning
    "idna>=3.15",        # idna.encode() bypass of CVE-2024-3651 fix
    "pygments>=2.20.0",  # ReDoS in GUID regex
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "security: marks tests as security tests",
    "unit: marks tests as unit tests",
    "postgres: parity tests that run the app against a real PostgreSQL testcontainer (requires Docker)",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
# G-P7d backend coverage gate. Coverage is intentionally NOT wired into pytest
# addopts so the plain `uv run pytest` inner loop stays fast (and does not
# interfere with pytest-xdist). Run the gate explicitly with:
#
#     uv run pytest -q --cov=app --cov-report=term-missing
#
# `fail_under` applies to coverage.py's single combined line+branch percentage
# (because branch=true above). Targets: line >=80 and branch >=70 are ENFORCED
# via this combined threshold; function >=90 is REPORTED-ONLY — coverage.py
# cannot enforce it, read it from the function regions of `uv run coverage json`.
fail_under = 80
show_missing = true
precision = 2
exclude_also = [
    # Entrypoint boilerplate — not executable under pytest.
    "if __name__ == .__main__.:",
]

[tool.pyright]
pythonVersion = "3.14"
include = ["app"]
exclude = ["tests", "**/__pycache__", ".venv"]
ignore = [".venv"]
strict = []
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"
venvPath = "."
venv = ".venv"
